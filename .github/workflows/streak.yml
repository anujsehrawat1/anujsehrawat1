name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Seedha 'output' branch ko checkout karenge
      - name: Checkout Output Branch
        uses: actions/checkout@v4
        with:
          ref: output 

      # Step 2: SVG Download karenge
      - name: Download Streak Stats SVG
        run: |
          curl -o streak-stats.svg "https://github-readme-streak-stats.herokuapp.com/?user=anujsehrawat1&theme=tokyonight&hide_border=true"
          
      # Step 3: Commit aur Push karenge
      - name: Commit and Push to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "chore: update daily streak stats" || exit 0
          git push origin output
